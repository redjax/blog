---
####################
# Hugo core config #
####################

baseURL: https://example.org/
locale: en-US
title: Techobyte Blog

permalinks:
  posts: /posts/:slug/
  notes: /notes/:slug/
  snippets: /notes/snippets/:slug

taxonomies:
  tag: tags
  category: categories
  series: series

menu:
  main:
    - identifier: posts
      name: posts
      url: /posts/
      weight: 10
    - identifier: notes
      name: notes
      url: /notes/
      weight: 20
    - identifier: series
      name: series
      url: /series/
      weight: 30
    - identifier: tags
      name: tags
      url: /tags/
      weight: 40
    - identifier: search
      name: search
      url: /search/
      weight: 50
    - identifier: archive
      name: archive
      url: /archive/
      weight: 60
    - identifier: rss
      name: "rss"
      url: "/index.xml"
      weight: 70

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod
    - path: github.com/martignoni/hugo-notice

pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

pygmentsUseClasses: true
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai

#########################
# PaperMod Theme Config #
#########################
params:
  ## Disable schema.org JSON-LD, fixes page bundle navigation
  disableSchema: true
  ## Prevent PaperMod from dynamically injecting section menus
  disableSectionMenus: true
  mainSections:
    - posts
    - notes

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  showTaxonomies: true

  assets:
    disableFingerprinting: true
    disableHLJS: true
    manifest: "/site.webmanifest"
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "Techobyte"
    iconHeight: 35

  profileMode:
    enabled: false
    title: Techobyte
    subtitle: "Personal blog about technology & computing"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Welcome to Techobyte"
    Content: A text-heavy personal blog about technology & computing, covering topics like Linux, scripting/programming (Python, Bash, Powershell, Go), DevOps, automation, and more.

  socialIcons:
    - name: github
      url: https://github.com/TechobyteDigital

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]
