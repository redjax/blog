---
############################################################
# PR validation pipeline.                                  #
#                                                          #
# Runs on every PR targeting main.                         #
#                                                          #
# If files that can affect the Hugo site have changed, the #
# Hugo build is run. Otherwise it is skipped.              #
#                                                          #
# renovate-gate is the single required PR check. It passes #
# when the Hugo build passes or is skipped, and fails when #
# the Hugo build fails.                                    #
############################################################

name: PR checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: write
  contents: write

jobs:
  changes:
    name: Determine required checks
    runs-on: ubuntu-latest

    outputs:
      hugo: ${{ steps.changes.outputs.hugo }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Determine changed files
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          hugo=false

          while IFS= read -r file; do
            case "$file" in
              archetypes/*|\
              content/*|\
              data/*|\
              i18n/*|\
              static/*|\
              hugo.yml|\
              go.mod|\
              go.sum|\
              *.css)
                hugo=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "Hugo build required: $hugo"
          echo "hugo=$hugo" >> "$GITHUB_OUTPUT"

  hugo:
    name: Build Hugo site
    needs: changes
    if: needs.changes.outputs.hugo == 'true'

    uses: redjax/pipelinetemplates/.github/workflows/hugo-build.yml@main
    with:
      hugo-version: "0.164.0"
      site-root: "."
      artifact-name: "hugo-site"
      public-dir: "public"
      check-changed: "false"
      use-cache: "false"
      clean-cache: "false"
      environment: "production"
      build-flags: "--gc --minify --enableGitInfo"
      artifact-retention-days: 7
      artifact-if-no-files-found: "error"
      runner-image: "ubuntu-latest"
      checkout-ref: ${{ github.event.pull_request.head.sha }}
      debug-build-state: false
    secrets: inherit

  renovate-gate:
    name: Renovate gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - hugo
    if: always()

    steps:
      - name: Check Hugo build result
        env:
          HUGO_RESULT: ${{ needs.hugo.result }}
        run: |
          case "$HUGO_RESULT" in
            success)
              echo "Hugo build passed."
              ;;
            skipped)
              echo "Hugo build was not required."
              ;;
            *)
              echo "Hugo build failed or was cancelled: $HUGO_RESULT"
              exit 1
              ;;
          esac
