timeout = 20
max_retries = 3
retry_wait_time = 2
no_progress = true

accept = ["200..=299", "403", "429"]

exclude = [
    "^mailto:",
    "^tel:",
    "^javascript:",
    "^data:",
    "linkedin\\.com",
    "twitter\\.com",
    "x\\.com",
    "facebook\\.com",
    "forgejo\\.org",
]

include_fragments = false
extensions = ["html", "htm", "md", "markdown"]
